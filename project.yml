name: Calendar
options:
  bundleIdPrefix: com.panda
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Calendar:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CalendarApp
    resources:
      - path: CalendarApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panda.calendar
        PRODUCT_NAME: Calendar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calendar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Calendar needs full calendar access to sync and edit iCloud events.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Calendar needs access to show and manage your events.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
